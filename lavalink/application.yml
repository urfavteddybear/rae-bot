server:
  port: 2333
  address: 0.0.0.0
  http2:
    enabled: false

plugins:
  lavasrc:
    providers:
      - 'dzisrc:%ISRC%'
      - 'dzsearch:%QUERY%'
      - 'ytsearch:"%ISRC%"'
      - 'ytsearch:%QUERY%'
    sources:
      spotify:
        clientId: ''            # optional – fill to enable Spotify search
        clientSecret: ''
      appleMusic:
        mediaAPIToken: ''       # optional – fill to enable Apple Music search
      deezer:
        masterDecryptionKey: '' # optional – needed for HQ audio decryption
      flowerytts:
        voice: 'Olivia'
        translate: false
        silence: 0
        speed: 1.0
        audioFormat: 'mp3'
    lyrics:
      genius:
        token: ''
  youtube:
    enabled: false

lavalink:
  server:
    password: 'youshallnotpass'
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ''
  environment: ''
  tags:
    some_key: some_value
    another_key: another_value

logging:
  file:
    path: ./logs
  level:
    root: INFO
    lavalink: INFO
